services:
  # ── API Server ──────────────────────────────────────────────────────────────
  - type: web
    name: artha-monitor-api
    runtime: node
    buildCommand: npm install && npm run build --workspace=@artha-monitor/shared && npm run build --workspace=@artha-monitor/api && npx prisma generate --schema=backend/api/prisma/schema.prisma && npx prisma db push --schema=backend/api/prisma/schema.prisma
    startCommand: node backend/api/dist/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: info
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 90d
      # ↓ Set these in Render dashboard → Environment
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false   # e.g. https://your-app.netlify.app

  # ── Probe Worker ────────────────────────────────────────────────────────────
  - type: web
    name: artha-monitor-worker
    runtime: node
    healthCheckPath: /health
    buildCommand: npm install && npm run build --workspace=@artha-monitor/shared && npm run build --workspace=@artha-monitor/worker && npx prisma generate --schema=backend/api/prisma/schema.prisma
    startCommand: node backend/worker/dist/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: WORKER_CONCURRENCY
        value: 10
      - key: WORKER_JOB_TIMEOUT
        value: 30000
      # ↓ Same DATABASE_URL as the API — set once in Render dashboard
      - key: DATABASE_URL
        sync: false
